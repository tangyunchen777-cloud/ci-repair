name: Class 4 Docker validation

on:
  pull_request:
  push:
    branches: [class4-durable-ingestion]

permissions:
  contents: read

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build one Python 3.12 application image
        run: |
          cp .env.example .env
          docker compose build api
      - name: Run unit and preserved Class 2 contract tests in Docker
        run: docker run --rm ci-repair:class4 python -m pytest -q -m 'not integration' -p no:cacheprovider
      - name: Start healthy PostgreSQL 16 and LocalStack
        run: docker compose up -d --wait postgres localstack
      - name: Exercise Alembic upgrade, downgrade, upgrade, and schema check
        run: |
          docker compose run --rm migration
          docker compose run --rm migration alembic downgrade base
          docker compose run --rm migration
          docker compose run --rm migration alembic check
      - name: Start API on PORT=8080
        run: docker compose up -d --wait api
      - name: Run full Compose integration suite
        run: docker compose --profile test run --rm test
      - name: Verify unprivileged image and graceful worker SIGTERM
        run: |
          test "$(docker compose run --rm --no-deps api id -u)" = 10001
          docker compose run --no-deps -d --name ci-repair-worker-smoke -e GITHUB_TOKEN=unused-smoke-token worker
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' ci-repair-worker-smoke)" = true
          docker stop -t 240 ci-repair-worker-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' ci-repair-worker-smoke)" = 0
      - name: Show container logs
        if: always()
        run: |
          docker compose logs --no-color
          docker logs ci-repair-worker-smoke 2>/dev/null || true
      - name: Remove isolated test containers and volumes
        if: always()
        run: |
          docker rm -f ci-repair-worker-smoke 2>/dev/null || true
          docker compose --profile test down -v --remove-orphans
